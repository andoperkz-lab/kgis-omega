  if (!f.source_url || !String(f.source_url).startsWith('https://')) throw Error('Connected feed requires HTTPS source provenance');
  if (!f.verified_at || !Number.isFinite(Date.parse(f.verified_at))) throw Error('Connected feed requires verification timestamp');
  if (!Array.isArray(f.draws) || !f.draws.length) throw Error('Connected feed must provide completed draws');
  const keys = new Set();
  for (const d of f.draws) {
    if (!d || !Number.isInteger(d.game) || d.game < 0 || !d.session || !d.drawn_at || !Array.isArray(d.numbers) || d.numbers.length !== 20 || new Set(d.numbers).size !== 20 || d.numbers.some(n => !Number.isInteger(n) || n < 1 || n > 80)) throw Error('Invalid completed draw');
    const k = `${d.session}|${d.game}`;
    if (keys.has(k)) throw Error('Repeated draw ID in official feed snapshot');
    keys.add(k);
  }
  return { connected: true, draws: f.draws, message: 'Official draw snapshot structure verified' };
}

// Detect missing interior game IDs within each operator session; never invent records.
function missingGames(draws, limit = 200) {
  const sessions = new Map();
  for (const d of draws || []) {
    if (!d || !d.session || !Number.isInteger(d.game)) continue;
    if (!sessions.has(d.session)) sessions.set(d.session, new Set());
    sessions.get(d.session).add(d.game);
  }
  const gaps=[];
  for (const [session, nums] of sessions) {
    const sorted=[...nums].sort((a,b)=>a-b);
    for (let i=1;i<sorted.length;i++) {
      for(let n=sorted[i-1]+1;n<sorted[i];n++) {
        gaps.push({session,game:n});
        if(gaps.length>=limit)return gaps;
      }
    }
  }
  return gaps;
}

<div class="card"><h3>Official live connection</h3><div class="notice">${escapeHTML(feedStatus.reason)}<br><span class="small">Source: https://www.kenogo.com.au/results · Last feed verification: ${feedStatus.verified_at?escapeHTML(feedStatus.verified_at):'Never'}</span></div><div class="buttons"><button class="btn primary" data-action="sync">Check approved feed</button><button class="btn" data-action="open-kenogo">Official results ↗</button></div><p>Automated official imports require provider-permitted, machine-readable results. KenoGO's website previously blocked automated fetching with HTTP 403. No site protection is bypassed.</p></div>
<div class="card"><h3>Export / backup</h3><div class="buttons"><button class="btn" data-action="export-json">Export all draws + predictions</button><button class="btn" data-action="export-csv">Export draw CSV</button></div><label>Restore from KGIS JSON backup</label><input id="import-file" type="file" accept=".json,application/json" class="field"><p>Records are stored on this iPhone/browser (localStorage). Clearing website data deletes local changes unless you've exported them. Another phone does not automatically share this data.</p></div>
<div class="card"><h3>Free hosting</h3><p>KGIS V5 works without paid AI credits. Upload this ZIP on a free Cloudflare Pages Direct Upload site or publish the files from a public GitHub Pages repository. The published site can be added to your iPhone home screen.</p><div class="buttons"><button class="btn" data-action="open-cloudflare">Cloudflare Pages ↗</button><button class="btn" data-action="open-github">GitHub Pages ↗</button></div></div>
<div class="card"><h3>Data safety</h3><p>Seeded: 4 screenshot-transcribed reset games and 46 prior PDF-transcribed games, preserved in separate sessions. They are not official API verified.</p><button data-action="restore-seed" class="btn warn">Restore the seeded 50 draws</button></div>
<div class="card"><h3>Install on iPhone</h3><p>Safari → Share → Add to Home Screen. You can also keep using the site in Safari without installing an app.</p></div>`}
function render(){save();topBar();let html=({home, colours,live:watchPage,draws:drawsPage,math:mathPage,lab:labPage,monitor:monitorPage,settings:settingsPage})[config.tab]();$('main').innerHTML=html;if(config.tab==='math')updateOdds()}
function updateOdds(){const el=$('odds-calc');if(!el)return;const p=fullMatch(config.spot),raw=Number($('attempts')?.value||10000),n=Math.max(1,Math.min(1e9,raw));el.innerHTML=`Chance of at least one full match over ${fmt(n)} independent games: <strong>${pct(profitChanceFromFullMatch(p,n))}</strong>. Approximately <strong>${fmt(gamesToChance(p,.5))}</strong> independent games for 50%, or <strong>${fmt(gamesToChance(p,.95))}</strong> for 95%. At $1 each, stakes would be $${fmt(n)} for ${fmt(n)} games.`}
function addDraw(form){let fd=new FormData(form);const nums=parseNumbers(fd.get('numbers'));const d=validateDraw({session:config.session,game:Number(fd.get('game')),drawn_at:String(fd.get('drawn_at')),numbers:nums,source_type:'manual_entry',source_ref:'iPhone entry'});const r=mergeDraws(draws,[d]);if(!r.added.length){toast('Game already recorded, identical.');return}draws=r.draws;toast('Saved Game '+d.game+'. Source: manual entry.');render()}
function commit(){const s=selected();if(s.length<config.lookback||!hasConsecutiveGames(s.slice(-config.lookback)))return toast('Need consecutive, complete preceding draws to lock a prediction.');let latest=s.at(-1);let target=latest.game+1;if(s.some(d=>d.game===target)||predictions.some(p=>p.session===config.session&&p.target_game===target&&p.spot===config.spot))return toast('Cannot lock: target already known or locked.');let picks=selection(s,config.spot,config.method,config.lookback);predictions.push({session:config.session,target_game:target,spot:config.spot,method:config.method,lookback:config.lookback,picks,created_at:new Date().toISOString(),source:'Local paper protocol, not externally notarised'});toast('Paper prediction locked for Game '+target);render()}
function download(name,data,mime){const blob=new Blob([data],{type:mime});const url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
async function sync(silent=false){if(feedInFlight)return;feedInFlight=true;lastSyncAt=new Date().toISOString();if(location.protocol==='file:'||location.protocol==='about:'){feedStatus={connected:false,status:'LOCAL_FILE',reason:'Offline file preview. Live sync requires approved hosted feed.',verified_at:null};feedInFlight=false;render();return}if(!silent)toast('Checking approved feed…');try{let resp=await fetch('./data/feed.json?t='+Date.now(),{cache:'no-store'});if(!resp.ok)throw Error('Feed returned HTTP '+resp.status);let f=await resp.json();const parsed=validateFeedEnvelope(f);let lastDraw=f.draws?.length?f.draws.map(d=>d.drawn_at).sort().at(-1):null;feedStatus={connected:parsed.connected,verified_at:f.verified_at||null,last_draw_at:lastDraw,gaps:parsed.connected?missingGames(f.draws):[],status:f.status||'NO_AUTHORISED_FEED',reason:parsed.message};if(parsed.connected){const clean=f.draws.map(x=>validateDraw({...x,source_type:'official_live'}));const z=mergeDraws(draws,clean);draws=z.draws;if(!silent||z.added.length)toast(`Feed checked. ${z.added.length} new official draws.`);if(z.added.length&&config.tab==='live'){stopReplay();config.session=z.added.at(-1).session;replay.game=z.added.at(-1).game;replay.shown=0;setTimeout(()=>{if(config.tab==='live')changeReplay('replay-play')},0);}}else if(!silent)toast('Official feed disconnected: '+feedStatus.reason);render()}catch(err){feedStatus={connected:false,status:'FETCH_ERROR',reason:'Feed check failed: '+err.message,verified_at:null};if(!silent)toast(feedStatus.reason);render()}finally{feedInFlight=false}}
async function restoreFile(file){if(!file)return;try{let v=JSON.parse(await file.text());let incoming=Array.isArray(v)?v:v.draws;if(!Array.isArray(incoming))throw Error('Backup must contain draws array');let result=mergeDraws(draws,incoming);draws=result.draws;if(Array.isArray(v.predictions)){for(const p of v.predictions){if(!predictions.some(x=>x.session===p.session&&x.target_game===p.target_game&&x.spot===p.spot))predictions.push(p)}}toast(`Restored ${result.added.length} draws`);render()}catch(e){toast('Import rejected: '+e.message)}}
const website=(url)=>window.open(url,'_blank','noopener,noreferrer');
document.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.dataset.tab){if(btn.dataset.tab!=='live')stopReplay();config.tab=btn.dataset.tab;if(config.tab==='live'){replay.session=config.session;const available=selected();if(!available.some(d=>d.game===replay.game)){replay.game=available.at(-1)?.game||1;replay.shown=0;}}render();window.scrollTo(0,0);return}const action=btn.dataset.action;if(!action)return;if(action?.startsWith('replay-')){changeReplay(action)}else if(action==='official-live'){website(OFFICIAL_LIVE_URL)}else if(action==='simulate'){const s=selected();simResult=monteCarlo(config.sims,config.seed,config.spot,config.lookback,config.method,TABLE[config.spot]);render()}
else if(action==='commit')commit();else if(action==='sync')sync();else if(action==='open-kenogo')website('https://www.kenogo.com.au/results');else if(action==='open-cloudflare')website('https://dash.cloudflare.com/');else if(action==='open-github')website('https://github.com/new');else if(action==='export-json')download('KGIS-OMEGA-backup.json',JSON.stringify({version:'KGIS FREE V5',exported_at:new Date().toISOString(),draws,predictions},null,2),'application/json');else if(action==='export-csv'){const cols=['session','game','drawn_at','source_type',...Array.from({length:20},(_,i)=>'n'+(i+1))];let lines=[cols.join(',')];for(let d of draws)lines.push([d.session,d.game,d.drawn_at,d.source_type,...d.numbers].join(','));download('KGIS-draws.csv',lines.join('\n'),'text/csv')}
else if(action==='restore-seed'){if(confirm('Restore the original 50 seeded draws? Other manually imported draws will be lost.')){draws=sortDraws(SEED.map(validateDraw));predictions=[];toast('Restored.');render()}}});
document.addEventListener('change',e=>{let id=e.target.id;if(id==='session-choice'){config.session=e.target.value;stopReplay();simResult=null;render()}else if(id==='replay-game'){stopReplay();replay.game=Number(e.target.value);replay.shown=0;render()}else if(id==='spot-select'||id==='lab-spot'){config.spot=Number(e.target.value);simResult=null;render()}else if(id==='lookback'){config.lookback=Number(e.target.value);simResult=null;render()}else if(id==='lab-method'){config.method=e.target.value;simResult=null;render()}else if(id==='import-file')restoreFile(e.target.files?.[0])});document.addEventListener('input',e=>{if(e.target.id==='attempts')updateOdds()});
document.addEventListener('submit',e=>{if(e.target.id==='add-draw'){e.preventDefault();try{addDraw(e.target)}catch(err){toast(err.message)}}});
render();sync(true);setInterval(()=>{if(document.visibilityState==='visible'&&navigator.onLine)sync(true);else topBar()},90_000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-Date.parse(lastSyncAt||0)>90_000)sync(true)});
</script></body></html>
